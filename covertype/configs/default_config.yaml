# Default Configuration for OPSO Neural Network Hyperparameter Optimization

project:
  name: "OPSO_NeuralNetwork_Covertype"
  seed: 42

data:
  raw_path: "data/raw/covertype/covtype.data"
  target_column: "Cover_Type"
  test_size: 0.2
  cv_folds: 3

search_space:
  # [n_neurons, log10(lr), log10(alpha)]
  lower_bounds: [16, -4.0, -5.0]
  upper_bounds: [256, -1.0, -1.0]

pso:
  n_particles: 20
  max_iter: 30
  w: 0.7298
  c1: 1.49618
  c2: 1.49618
  w_max: 0.9
  w_min: 0.4

results:
  checkpoints_dir: "results/checkpoints"
  figures_dir: "results/figures"
